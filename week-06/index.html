<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f4f">
<title>오늘 급식</title>
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --text: #222222;
    --sub: #6b6b6b;
    --line: #e4e0d6;
    --accent: #2f6f4f;
    --accent-soft: #e3efe8;
    --warn: #b3412e;
    --warn-soft: #fbeae6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161816;
      --card: #212421;
      --text: #ececec;
      --sub: #a3a3a3;
      --line: #343834;
      --accent: #7cc39c;
      --accent-soft: #263a2e;
      --warn: #f08b77;
      --warn-soft: #3a2420;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.5;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 16px 40px;
  }
  header { margin-bottom: 16px; }
  h1 { font-size: clamp(1.5rem, 5vw, 1.9rem); margin: 0; }
  .date { color: var(--sub); margin: 4px 0 0; }
  .school {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; flex-wrap: wrap; margin-top: 8px; color: var(--sub); font-size: .95rem;
  }
  button, input, select { font: inherit; }
  .btn {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 8px 14px; cursor: pointer; min-height: 40px;
  }
  .btn.main { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn.main { color: #10241a; } }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 12px;
  }
  .meal-name {
    display: inline-block; background: var(--accent-soft); color: var(--accent);
    font-weight: 700; font-size: .9rem; border-radius: 999px; padding: 2px 12px; margin-bottom: 8px;
  }
  .menu { list-style: none; margin: 0; padding: 0; }
  .menu li { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 1.08rem; }
  .menu li:last-child { border-bottom: 0; }
  .allergy { color: var(--sub); font-size: .72rem; margin-left: 6px; white-space: nowrap; }
  .kcal { color: var(--sub); font-size: .85rem; margin-top: 8px; }
  .notice { text-align: center; padding: 32px 16px; }
  .notice p { margin: 0 0 4px; }
  .notice .big { font-size: 1.2rem; font-weight: 700; }
  .notice.error { background: var(--warn-soft); border-color: var(--warn); }
  .notice.error .big { color: var(--warn); }
  .notice .btn { margin-top: 14px; }
  .spinner {
    width: 32px; height: 32px; margin: 0 auto 12px; border-radius: 50%;
    border: 4px solid var(--line); border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  .search { display: flex; flex-direction: column; gap: 10px; }
  .search label { font-size: .9rem; color: var(--sub); }
  .search input, .search select {
    width: 100%; padding: 10px 12px; border-radius: 10px; min-height: 44px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  .results { list-style: none; padding: 0; margin: 12px 0 0; }
  .results li { margin-bottom: 8px; }
  .results button {
    width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg);
    color: var(--text); border-radius: 10px; padding: 10px 12px; cursor: pointer;
  }
  .results small { display: block; color: var(--sub); }
  details { color: var(--sub); font-size: .85rem; margin-top: 16px; }
  details ol { padding-left: 1.6em; columns: 2; column-gap: 16px; }
  @media (min-width: 480px) { details ol { columns: 3; } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>오늘 급식</h1>
    <p class="date" id="date"></p>
    <div class="school" id="schoolBar">
      <span id="schoolName"></span>
      <button class="btn" id="changeBtn" type="button">학교 바꾸기</button>
    </div>
  </header>

  <!-- 학교 찾기 (처음 한 번) -->
  <section class="card hidden" id="searchBox">
    <form class="search" id="searchForm">
      <p style="margin:0">처음 한 번만 학교를 골라 주세요. 고른 학교는 이 기기에만 저장돼요.</p>
      <label for="region">지역 (선택)</label>
      <select id="region">
        <option value="">전체</option>
        <option value="B10">서울</option>
        <option value="C10">부산</option>
        <option value="D10">대구</option>
        <option value="E10">인천</option>
        <option value="F10">광주</option>
        <option value="G10">대전</option>
        <option value="H10">울산</option>
        <option value="I10">세종</option>
        <option value="J10">경기</option>
        <option value="K10">강원</option>
        <option value="M10">충북</option>
        <option value="N10">충남</option>
        <option value="P10">전북</option>
        <option value="Q10">전남</option>
        <option value="R10">경북</option>
        <option value="S10">경남</option>
        <option value="T10">제주</option>
      </select>
      <label for="schoolInput">학교 이름</label>
      <input id="schoolInput" type="search" placeholder="예: 한빛중학교" autocomplete="off" required>
      <button class="btn main" type="submit">찾기</button>
    </form>
    <div id="searchStatus"></div>
    <ul class="results" id="results"></ul>
  </section>

  <!-- 급식 -->
  <section id="mealBox" aria-live="polite"></section>

  <details id="legend" class="hidden">
    <summary>알레르기 번호 뜻</summary>
    <ol>
      <li>난류</li><li>우유</li><li>메밀</li><li>땅콩</li><li>대두</li>
      <li>밀</li><li>고등어</li><li>게</li><li>새우</li><li>돼지고기</li>
      <li>복숭아</li><li>토마토</li><li>아황산류</li><li>호두</li><li>닭고기</li>
      <li>쇠고기</li><li>오징어</li><li>조개류</li><li>잣</li>
    </ol>
  </details>
</main>

<script>
(function () {
  "use strict";

  var API = "https://open.neis.go.kr/hub/";
  var STORE_KEY = "lunch-app-school";
  var TIMEOUT_MS = 10000;

  var $ = function (id) { return document.getElementById(id); };

  /* ---------- 오늘 날짜 (한국 시간) ---------- */
  function koreaToday() {
    var parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit"
    }).formatToParts(new Date());
    var get = function (t) { return parts.filter(function (p) { return p.type === t; })[0].value; };
    return get("year") + get("month") + get("day");
  }
  function prettyDate(ymd) {
    var d = new Date(+ymd.slice(0, 4), +ymd.slice(4, 6) - 1, +ymd.slice(6, 8));
    var days = ["일", "월", "화", "수", "목", "금", "토"];
    return (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + days[d.getDay()] + "요일";
  }

  /* ---------- 저장 (이 기기에만) ---------- */
  function loadSchool() {
    try { var v = JSON.parse(localStorage.getItem(STORE_KEY)); if (v && v.office && v.code) return v; } catch (e) {}
    return null;
  }
  function saveSchool(s) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
  }

  /* ---------- API 부르기: 실패하면 까닭을 담은 오류 ---------- */
  function callApi(service, params) {
    var q = new URLSearchParams(Object.assign({ Type: "json", pIndex: "1", pSize: "100" }, params));
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, TIMEOUT_MS);

    if (navigator.onLine === false) {
      clearTimeout(timer);
      return Promise.reject(new Error("인터넷에 연결돼 있지 않아요. 와이파이나 데이터를 켜고 다시 해 보세요."));
    }

    return fetch(API + service + "?" + q.toString(), ctrl ? { signal: ctrl.signal } : {})
      .then(function (res) {
        if (!res.ok) throw new Error("급식 서버가 응답하지 않아요 (오류 " + res.status + "). 잠시 뒤에 다시 해 보세요.");
        return res.json();
      }, function (err) {
        if (err && err.name === "AbortError") throw new Error("급식 서버가 너무 오래 대답하지 않아요. 잠시 뒤에 다시 해 보세요.");
        throw new Error("급식 서버에 연결하지 못했어요. 인터넷 연결을 확인해 보세요.");
      })
      .then(function (json) {
        clearTimeout(timer);
        if (json[service]) {
          var head = json[service][0].head;
          var rows = (json[service][1] && json[service][1].row) || [];
          var code = head[1] && head[1].RESULT && head[1].RESULT.CODE;
          if (code && code !== "INFO-000") throw new Error("나이스 오류: " + head[1].RESULT.MESSAGE);
          return rows;
        }
        var r = json.RESULT || {};
        if (r.CODE === "INFO-200") return [];           // 해당 데이터 없음
        throw new Error("나이스에서 이런 답이 왔어요: " + (r.MESSAGE || "알 수 없는 응답"));
      })
      .catch(function (err) { clearTimeout(timer); throw err; });
  }

  /* ---------- 화면 알림 ---------- */
  function showLoading(box, text) {
    box.innerHTML = "";
    var card = el("div", "card notice");
    card.appendChild(el("div", "spinner"));
    card.appendChild(el("p", "", text));
    box.appendChild(card);
  }
  function showNotice(box, big, small) {
    box.innerHTML = "";
    var card = el("div", "card notice");
    card.appendChild(el("p", "big", big));
    if (small) card.appendChild(el("p", "", small));
    box.appendChild(card);
  }
  function showError(box, message, retry) {
    box.innerHTML = "";
    var card = el("div", "card notice error");
    card.setAttribute("role", "alert");
    card.appendChild(el("p", "big", "정보를 받아 오지 못했어요"));
    card.appendChild(el("p", "", message));
    if (retry) {
      var b = el("button", "btn", "다시 시도");
      b.type = "button";
      b.addEventListener("click", retry);
      card.appendChild(b);
    }
    box.appendChild(card);
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- 메뉴 한 줄 나누기: 이름 + 알레르기 번호 ---------- */
  function parseDish(line) {
    var text = line.replace(/&amp;/g, "&").trim();
    var m = text.match(/\s*\(([\d.\s]+)\)\s*$/) || text.match(/((?:\d{1,2}\.)+)\s*$/);
    if (!m) return { name: text, allergy: "" };
    var nums = m[1].split(/[.\s]+/).filter(Boolean).join(", ");
    return { name: text.slice(0, m.index).trim() || text, allergy: nums };
  }

  /* ---------- 급식 보여 주기 ---------- */
  var mealBox = $("mealBox");
  var ymd = koreaToday();
  var testDate = new URLSearchParams(location.search).get("date");
  if (testDate && /^\d{8}$/.test(testDate)) ymd = testDate;
  $("date").textContent = prettyDate(ymd);

  function loadMeal(school) {
    $("searchBox").classList.add("hidden");
    $("schoolBar").classList.remove("hidden");
    $("schoolName").textContent = school.name || "";
    showLoading(mealBox, "오늘 급식을 불러오는 중이에요…");

    callApi("mealServiceDietInfo", {
      ATPT_OFCDC_SC_CODE: school.office,
      SD_SCHUL_CODE: school.code,
      MLSV_YMD: ymd
    }).then(function (rows) {
      if (!rows.length) {
        $("legend").classList.add("hidden");
        // 급식이 없을 때: 학교 코드가 맞는지 한 번 더 확인해서, 틀렸으면 까닭을 보여 준다
        return callApi("schoolInfo", { ATPT_OFCDC_SC_CODE: school.office, SD_SCHUL_CODE: school.code })
          .then(function (found) {
            if (!found.length) throw new Error("저장된 학교 코드로 학교를 찾을 수 없어요. '학교 바꾸기'로 학교를 다시 골라 주세요.");
            showNotice(mealBox, "오늘은 급식이 없습니다", "주말·방학·휴일이거나 아직 식단이 올라오지 않았을 수 있어요.");
          });
      }
      rows.sort(function (a, b) { return (+a.MMEAL_SC_CODE) - (+b.MMEAL_SC_CODE); });
      mealBox.innerHTML = "";
      rows.forEach(function (row) {
        var card = el("article", "card");
        card.appendChild(el("span", "meal-name", row.MMEAL_SC_NM || "급식"));
        var ul = el("ul", "menu");
        String(row.DDISH_NM || "").split(/<br\s*\/?>/i).forEach(function (line) {
          if (!line.trim()) return;
          var d = parseDish(line);
          var li = el("li", "", d.name);
          if (d.allergy) {
            var s = el("span", "allergy", d.allergy);
            s.setAttribute("aria-label", "알레르기 " + d.allergy);
            li.appendChild(s);
          }
          ul.appendChild(li);
        });
        card.appendChild(ul);
        if (row.CAL_INFO) card.appendChild(el("p", "kcal", row.CAL_INFO));
        mealBox.appendChild(card);
      });
      $("legend").classList.remove("hidden");
    }).catch(function (err) {
      $("legend").classList.add("hidden");
      showError(mealBox, err.message, function () { loadMeal(school); });
    });
  }

  /* ---------- 학교 찾기 ---------- */
  function openSearch() {
    mealBox.innerHTML = "";
    $("legend").classList.add("hidden");
    $("schoolBar").classList.add("hidden");
    $("searchBox").classList.remove("hidden");
    $("schoolInput").focus();
  }

  function runSearch() {
    var name = $("schoolInput").value.trim();
    var status = $("searchStatus");
    var list = $("results");
    list.innerHTML = "";
    if (!name) return;
    var params = { SCHUL_NM: name };
    if ($("region").value) params.ATPT_OFCDC_SC_CODE = $("region").value;

    showLoading(status, "학교를 찾는 중이에요…");
    callApi("schoolInfo", params).then(function (rows) {
      status.innerHTML = "";
      if (!rows.length) {
        showNotice(status, "찾는 학교가 없어요", "이름을 정확히 썼는지, 지역이 맞는지 확인해 보세요.");
        return;
      }
      rows.forEach(function (r) {
        var li = el("li");
        var b = el("button", "", r.SCHUL_NM);
        b.type = "button";
        b.appendChild(el("small", "", r.LCTN_SC_NM + " · " + r.ATPT_OFCDC_SC_NM));
        b.addEventListener("click", function () {
          var school = { office: r.ATPT_OFCDC_SC_CODE, code: r.SD_SCHUL_CODE, name: r.SCHUL_NM };
          saveSchool(school);
          loadMeal(school);
        });
        li.appendChild(b);
        list.appendChild(li);
      });
    }).catch(function (err) {
      showError(status, err.message, runSearch);
    });
  }

  $("searchForm").addEventListener("submit", function (e) { e.preventDefault(); runSearch(); });
  $("changeBtn").addEventListener("click", openSearch);

  /* ---------- 시작 ---------- */
  // 주소에 ?office=교육청코드&school=학교코드 를 붙여도 열 수 있어요 (확인용).
  var qs = new URLSearchParams(location.search);
  var fromUrl = qs.get("office") && qs.get("school")
    ? { office: qs.get("office"), code: qs.get("school"), name: "" } : null;
  var start = fromUrl || loadSchool();
  if (start) loadMeal(start); else openSearch();
})();
</script>
</body>
</html>
